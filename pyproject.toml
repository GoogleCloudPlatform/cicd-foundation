[project]
name = "cicd-foundation"
version = "6.0.0"
description = "Secure developer workstations and agentic CI/CD pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-antigravity>=0.1.22",
]

[dependency-groups]
dev = [
    # go/keep-sorted start
    "pytest-cov>=7.1.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    # go/keep-sorted end
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E402"] # Allow imports not at top (needed for python mocks in tests)
